[package]
name = "jt"
version = "0.1.0"
edition = "2021"
authors = ["458 Development Team"]
description = "High-performance NTFS USN Journal parser and anti-forensics detector for PC Checkers"

[[bin]]
name = "458-jt"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.28", default-features = false, features = [
    "default_fonts",
    "glow",
] }
egui = "0.28"
egui_extras = { version = "0.28", features = ["all_loaders"] }

windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_System_SystemServices",
] }
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Ioctl",
    "Win32_Security",
] }

rayon = "1.10"
crossbeam-channel = "0.5"
memmap2 = "0.9"
byteorder = "1.5"

chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
